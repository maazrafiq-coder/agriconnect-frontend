<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pakistan's digital agriculture marketplace — connecting farmers, millers, traders and exporters." />
    <title>AgriConnect PK — Agriculture Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #F5F0E8; color: #111827; }
      /* Visible keyboard focus everywhere (many controls set outline:none inline). */
      :focus-visible { outline: 2px solid #2563EB !important; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
      /* Narrow-screen fallbacks for the few fixed-column layouts (inline styles need !important). */
      @media (max-width: 860px) { .ac-split-aside { grid-template-columns: 1fr !important; } }
      @media (max-width: 700px) {
        .ac-split { grid-template-columns: 1fr !important; }
        .ac-admin-sidebar { width: 100% !important; padding: 10px 0 !important; }
      }
      @media (max-width: 640px) { .ac-filter-grid { grid-template-columns: 1fr 1fr !important; } }
      @media (max-width: 520px) { .ac-grid-4 { grid-template-columns: 1fr 1fr !important; } .ac-filter-grid { grid-template-columns: 1fr !important; } }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #F5F0E8; }
      ::-webkit-scrollbar-thumb { background: #B7A05A; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
